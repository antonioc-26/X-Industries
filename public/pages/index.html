Author: Antonio Corona
Last Updated: 2026-03-19
Project: X-Industries
Page: Home
File: index.html

Description:
This is the main landing page of X-Industries. It displays featured products,
category navigation, and entry points into the shopping experience.

Dependencies:
- ../styles/styles.css     -> Global styling for layout and UI
- ../js/app.js             -> Loads featured products and homepage data

Notes:
- Serves as the primary entry point for users
- Links to all major categories and product browsing flows
===============================================================================
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Homepage - Amazone 2.0</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <script
      src="https://kit.fontawesome.com/aa8c13a461.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header class="website-header">
      <div class="header-top">
        <h1>X-Industries</h1>
      </div>

      <div class="header-middle">
        <div class="nav">
          <nav>
            <a href="/"><button id="homeButton">Home</button></a>
            <a href="/books"><button id="booksButton">Books</button></a>
            <a href="/movies"><button id="moviesButton">Movies</button></a>
            <a href="/electronics"
              ><button id="electronicsButton">Electronics</button></a
            >
            <a href="/video-games"
              ><button id="video-gamesButton">Video Games</button></a
            >
            <a href="/toys"><button id="toysButton">Toys</button></a>
            <a href="/misc"><button id="miscButton">Misc</button></a>
          </nav>
        </div>
      </div>

      <div class="header-bottom">
        <a href="/login"><button id="accountButton">Login</button></a>

        <div id="searchWrapper">
          <input
            type="text"
            name="searchBar"
            id="searchBar"
            placeholder="Search X-Industries"
          />
          <button class="search-icon-btn" id="searchbutton" type="button">
            <i class="fa-solid fa-magnifying-glass-dollar"></i>
          </button>
        </div>
        <a href="/orders"><button id="ordersButton">Orders</button></a>

        <a href="/cart" class="cart-link">
          <div class="cart-container">
            <div class="cart-icon2">
              <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <span id="cart-count">0</span>
            <div id="cart-total">$0.00</div>
          </div>
        </a>
      </div>
    </header>

    <main>
      <div class="page-title">
        <h2>Home</h2>
      </div>

      <div class="main-grid">
        <section class="product-section" id="Books">
          <div class="cat-titles">
            <h3>Featured Books</h3>
          </div>
          <div id="product-grid-Books" class="product-grid"></div>
        </section>

        <section class="product-section" id="Movies">
          <div class="cat-titles">
            <h3>Movies</h3>
          </div>
          <div id="product-grid-Movies" class="product-grid"></div>
        </section>

        <section class="product-section" id="Electronics">
          <div class="cat-titles">
            <h3>Electronics</h3>
          </div>
          <div id="product-grid-Electronics" class="product-grid"></div>
        </section>

        <section class="product-section" id="Video Games">
          <div class="cat-titles">
            <h3>Video Games</h3>
          </div>

          <div id="product-grid-Video Games" class="product-grid"></div>
        </section>

        <section class="product-section" id="Toys">
          <div class="cat-titles">
            <h3>Toys</h3>
          </div>
          <div id="product-grid-Toys" class="product-grid"></div>
        </section>

        <section class="product-section" id="Miscellaneous">
          <div class="cat-titles">
            <h3>Miscellaneous</h3>
          </div>
          <div id="product-grid-Miscellaneous" class="product-grid"></div>
        </section>
      </div>
    </main>

    <div class="footer">
      <footer>
        <i>
          <small>
            Copyright &copy; X-Industries LLC Amazone 2.0 Corp.
            <a href="mailto:X-Industries@amazone2.0.com"
              >X-Industries@amazone2.0.com</a
            >
          </small>
        </i>
      </footer>
    </div>
    <script src="../js/cart.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/search.js"></script>
    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
