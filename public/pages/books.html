Page: Books Category
File: books.html

Description:
Displays all products within the Books category, allowing users to browse
and add items to their cart.

Dependencies:
- ../styles/styles.css     -> Global styling
- ../js/category.js        -> Handles category product loading and rendering

Notes:

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Books - Amazone 2.0</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <script
      src="https://kit.fontawesome.com/aa8c13a461.js"
      crossorigin="anonymous"
    ></script>


  <body>
    <header class="website-header">
      <div class="header-top">
        <h1>X-Industries</h1>
      </div>

      <div class="header-middle">
        <div class="nav">
          <nav>
            <a href="/"><button id="homeButton">Home</button></a>
            <a href="/books"><button id="booksButton">Books</button></a>
            <a href="/movies"><button id="moviesButton">Movies</button></a>
            <a href="/electronics"
              ><button id="electronicsButton">Electronics</button></a
            >
            <a href="/video-games"
              ><button id="video-gamesButton">Video Games</button></a
            >
            <a href="/toys"><button id="toysButton">Toys</button></a>
            <a href="/misc"><button id="miscButton">Misc</button></a>
          </nav>
        </div>
      </div>

      <div class="header-bottom">
        <a href="/login"><button id="accountButton">Login</button></a>

        <div id="searchWrapper">
          <input
            type="text"
            name="searchBar"
            id="searchBar"
            placeholder="Search X-Industries"
          />
          <button class="search-icon-btn" id="searchbutton" type="button">
            <i class="fa-solid fa-magnifying-glass-dollar"></i>
          </button>
        </div>
        <a href="/orders"><button id="ordersButton">Orders</button></a>

        <a href="/cart" class="cart-link">
          <div class="cart-container">
            <div class="cart-icon2">
                        <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <span id="cart-count">0</span>
            <div id="cart-total">$0.00</div>

          </div>
        </a>
      </div>
    </header>

    <main>
      <div class="page-title">
        <h2>Books</h2>
      </div>

      <div id="category-grid" class="category-grid" data-category="Books"></div>
    </main>

    <div class="footer">
      <footer>
        <i>
          <small>
            Copyright &copy; X-Industries LLC Amazone 2.0 Corp.
            <a href="mailto:X-Industries@amazone2.0.com"
              >X-Industries@amazone2.0.com</a
            >
          </small>
        </i>
      </footer>
    </div>

    <script type="module" src="../js/category.js"></script>
    <script src="../js/cart.js"></script>
    <script type="module" src="../js/search.js"></script>
    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
