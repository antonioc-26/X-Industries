<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Cart - Amazone 2.0</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/aa8c13a461.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="website-header">
      <div class="header-top">
        <h1>X-Industries</h1>
      </div>
      <div class="header-middle">
        <div class="nav">
          <nav>
            <a href="index.html"><button id="homeButton">Home</button></a>
            <a href="books.html"><button id="booksButton">Books</button></a>
            <a href="movies.html"><button id="moviesButton">Movies</button></a>
            <a href="electronics.html"
              ><button id="electronicsButton">Electronics</button></a
            >
            <a href="video-games.html"
              ><button id="video-gamesButton">Video Games</button></a
            >
            <a href="toys.html"><button id="toysButton">Toys</button></a>
            <a href="misc.html"><button id="miscButton">Misc</button></a>
          </nav>
        </div>
      </div>
      <div class="header-bottom">
        <a href="login.html"><button id="accountButton">Login</button></a>
        <div id="searchWrapper">
          <input
            type="text"
            name="searchBar"
            id="searchBar"
            placeholder="Search X-Industries"
          />
          <button class="search-icon-btn" id="searchbutton" type="button">
            <i class="fa-solid fa-magnifying-glass-dollar"></i>
          </button>
        </div>
        <a href="orders.html"><button id="ordersButton">Orders</button></a>
        <a href="cart.html" class="cart-link">
          <div class="cart-container">
            <div class="cart-icon2">
              <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <span id="cart-count">0</span>
            <div id="cart-total">$0.00</div>
          </div>
        </a>
      </div>
    </header>
    <main>
      <div class="page-title">
        <h2>Your Shopping Cart</h2>
      </div>
      <div class="center-container">
        <div id="shopping-cart-list" class="shopping-cart-list"></div>
        <div class="running-total">
          <h3>Current Total</h3>
          <p>
            Subtotal (<span id="running-cart-count">0</span> items):
            <b><span id="running-total-amount">$0.00</span></b>
          </p>
          <div class="place-order">
            <button id="place-order-button" onclick="placeOrder()">
              Place Order
            </button>
            <div class="clear-cart">
              <button id="clear-cart-btn" onclick="window.clearCart()">
                Clear Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="footer">
      <footer>
        <i>
          <small>
            Copyright &copy; X-Industries LLC Amazone 2.0 Corp.
            <a href="mailto:X-Industries@amazone2.0.com"
              >X-Industries@amazone2.0.com</a
            >
          </small>
        </i>
      </footer>
    </div>
    <script src="search.js"></script>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script>
      // Handle Place Order button click
      document.addEventListener("DOMContentLoaded", () => {
        const placeOrderBtn = document.getElementById("place-order-button");

        if (placeOrderBtn) {
          placeOrderBtn.addEventListener("click", () => {
            // Get current cart
            const currentCart = JSON.parse(localStorage.getItem("cart")) || [];

            if (currentCart.length === 0) {
              alert("Your cart is empty!");
              return;
            }

            // Copy entire cart to shadow cart
            sessionStorage.setItem("shadowCart", JSON.stringify(currentCart));

            // Redirect to buynow.html
            window.location.href = "buynow.html";
          });
        }
      });
    </script>
  </body>
</html>
